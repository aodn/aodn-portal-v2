name: Trigger Deploy

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
        description: The short-name of the app corresponding to the folder in appdeploy.
        type: string
      environment:
        required: true
        description: The environment to use for the deploy job.
        type: choice
        options:
          - edge
          - staging
          - production

  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  trigger_deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Coordinate application uploads with SEO publishing in this repository.
    # appdeploy applies infrastructure; it does not upload the application shell.
    concurrency:
      group: portal-site-${{ inputs.environment }}
      cancel-in-progress: false
      queue: max
    env:
      DIST: ./dist
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Record the application source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install yarn
        run: |
          yarn install --immutable

      - name: Set Build Command
        run: |
          case "${{ inputs.environment }}" in
            edge)
              echo "BUILD_CMD=edge" >> $GITHUB_ENV
              ;;
            staging)
              echo "BUILD_CMD=staging" >> $GITHUB_ENV
              ;;
            production)
              echo "BUILD_CMD=prod" >> $GITHUB_ENV
              ;;
          esac

      - name: Build Website
        run: yarn $BUILD_CMD

      - name: Configure AWS credentials
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Deploy Website to S3
        env:
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          # sitemap.xml and prerender/ are owned by the Publish SEO Artifacts workflow.
          # assets/ uses cp, not sync: every deploy re-stamps the live build's files,
          # so the prune step below can treat old timestamps as unreferenced.
          # Keep the previous shell until the new assets are uploaded. Excluding
          # index.html also protects its revision metadata from sync --delete.
          aws s3 sync --delete ${{ env.DIST }} s3://${{ vars.BUCKET }} --region ${{ vars.AWS_REGION }} --exclude "prerender/*" --exclude "sitemap.xml" --exclude "assets/*" --exclude "index.html" \
            --cache-control "public,max-age=300"
          # assets/ filenames carry a content hash, so they can be cached forever.
          aws s3 cp ${{ env.DIST }}/assets s3://${{ vars.BUCKET }}/assets --recursive --region ${{ vars.AWS_REGION }} \
            --cache-control "public,max-age=31536000,immutable"
          # index.html must always be revalidated: it is the file that names the
          # hashed bundles. Content and revision metadata change in one S3 PUT.
          # The run/attempt identifies same-SHA redeployments without versioning.
          index_sha256=$(sha256sum ${{ env.DIST }}/index.html | cut -d ' ' -f1)
          aws s3 cp ${{ env.DIST }}/index.html s3://${{ vars.BUCKET }}/index.html --region ${{ vars.AWS_REGION }} \
            --cache-control "no-cache" --content-type "text/html" \
            --metadata "repository=$DEPLOY_REPOSITORY,environment=$DEPLOY_ENVIRONMENT,commit-sha=$SOURCE_SHA,index-sha256=$index_sha256,deployment-id=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # Seed the fallback sitemap only when the bucket has none
          aws s3api head-object --bucket ${{ vars.BUCKET }} --key sitemap.xml --region ${{ vars.AWS_REGION }} >/dev/null 2>&1 \
            || aws s3 cp ${{ env.DIST }}/sitemap.xml s3://${{ vars.BUCKET }}/sitemap.xml --region ${{ vars.AWS_REGION }}

      - name: Prune assets no live build references
        run: |
          # Retention = 4 weekly SEO cycles: pages pin a build for 7 days normally,
          # so 30 days survives three missed Monday runs and any long-lived tab.
          # Deliberately deploy-time, not an S3 lifecycle rule: a deploy freeze
          # then deletes nothing, so a stale-but-live build can never expire.
          cutoff=$(date -u -d '30 days ago' '+%Y-%m-%dT%H:%M:%S')
          aws s3api list-objects-v2 --bucket ${{ vars.BUCKET }} --prefix assets/ --region ${{ vars.AWS_REGION }} \
            --query "Contents[?LastModified<'${cutoff}'].Key" --output text | tr '\t' '\n' \
            | while read -r key; do
                [ -n "${key}" ] && [ "${key}" != "None" ] && aws s3 rm "s3://${{ vars.BUCKET }}/${key}" --region ${{ vars.AWS_REGION }}
              done || true

      - name: Clear cloudfront cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ vars.DISTRIBUTION_ID }} \
          --paths "/*" \
          --region ${{ vars.AWS_REGION }}

      - name: Sync Cloud Artifacts
        run: |
          aws s3 sync \
            ./artifacts/ \
            "s3://${{ vars.ARTIFACT_BUCKET }}/" \
            --delete \
            --exclude "*.test.js" \
            --region "${{ vars.AWS_REGION }}" \
            --only-show-errors

      - name: Generate App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Trigger Deploy Workflow
        timeout-minutes: 35
        uses: actions/github-script@v8
        env:
          APP_NAME: ${{ inputs.app_name }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 3
          retry-exempt-status-codes: 204
          script: |
            const environment = process.env.DEPLOY_ENVIRONMENT;
            const waitForDeployment = ['staging', 'production'].includes(environment);
            const { data } = await github.rest.actions.createWorkflowDispatch({
              owner: 'aodn',
              repo: 'appdeploy',
              workflow_id: 'deploy.yml',
              ref: 'main',
              headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              return_run_details: waitForDeployment,
              inputs: {
                app_name: process.env.APP_NAME,
                environment,
              }
            });

            if (!waitForDeployment) return;
            if (!data.workflow_run_id) {
              throw new Error('Appdeploy dispatch did not return a workflow run ID');
            }

            core.info(`Waiting for deployment: ${data.html_url}`);
            const deadline = Date.now() + 30 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner: 'aodn',
                repo: 'appdeploy',
                run_id: data.workflow_run_id,
              });
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(`Deployment ${data.workflow_run_id} ended with ${run.conclusion}`);
                }
                core.info('Deployment succeeded');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error(`Timed out waiting for deployment ${data.workflow_run_id}`);

      # This step is reached only after the exact appdeploy run succeeds.
      # Dispatch separately so Lighthouse does not gate promotion to production.
      - name: Trigger post-deployment Lighthouse
        if: inputs.environment == 'staging' || inputs.environment == 'production'
        uses: actions/github-script@v8
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'lighthouse_release.yml',
              ref: context.ref,
              inputs: { environment: process.env.DEPLOY_ENVIRONMENT },
            });
