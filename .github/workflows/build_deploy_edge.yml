name: Build/Deploy Edge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/environment/**'

permissions:
  id-token: write
  contents: read

jobs:
  build_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Yarn install
        run: |
          yarn install --immutable

      - name: Build Website
        run: yarn edge

      - name: Verify SEO artifacts were built (warns without blocking the deploy)
        continue-on-error: true
        run: |
          artifacts_missing=0
          if [ ! -s dist/sitemap.xml ]; then
            echo "::warning title=sitemap.xml missing::generate-sitemap failed — see the Build Website log for the error"
            artifacts_missing=1
          fi
          pre_rendered_page_count=$(find dist/details -type f 2>/dev/null | wc -l | tr -d ' ')
          expected_page_count_at_least=1000
          if [ "$pre_rendered_page_count" -lt "$expected_page_count_at_least" ]; then
            echo "::warning title=pre-rendered detail pages missing::found $pre_rendered_page_count files in dist/details, expected ~15000 — see the Build Website log for the error"
            artifacts_missing=1
          fi
          exit $artifacts_missing

      - uses: actions/upload-artifact@v6
        with:
            name: build
            path: ./dist
            retention-days: 1

  edge_deploy:
    environment: edge
    runs-on: ubuntu-latest
    needs: build_push
    env:
      DIST: ./dist
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: build
          path: ./dist

      - name: Configure AWS credentials
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Copy files to the production website with the AWS CLI
        run: |
          aws s3 sync --delete ${{ env.DIST }} s3://${{ vars.BUCKET }} --region ${{ vars.AWS_REGION }} --exclude "details/*"
          # Pre-rendered detail pages are extensionless, so sync would guess
          # binary/octet-stream; force text/html so browsers render them
          if [ -d "${{ env.DIST }}/details" ]; then
            aws s3 sync --delete ${{ env.DIST }}/details s3://${{ vars.BUCKET }}/details --region ${{ vars.AWS_REGION }} --content-type text/html
          fi

      - name: Clear cloudfront cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ vars.DISTRIBUTION_ID }} \
          --paths "/*" \
          --region ${{ vars.AWS_REGION }}

      - name: Smoke check SEO pages are live on CloudFront (warns without failing the deploy)
        continue-on-error: true
        env:
          SITE: https://portal-edge.aodn.org.au
          INVALIDATION_PROPAGATION_SECONDS: 30
        run: |
          sleep "$INVALIDATION_PROPAGATION_SECONDS"
          curl -sf -o /dev/null "$SITE/sitemap.xml" \
            || { echo "::warning title=sitemap.xml not live::$SITE/sitemap.xml is not being served"; exit 1; }
          first_detail_uuid=$(curl -s "$SITE/sitemap.xml" | grep -o '/details/[^<]*' | head -1 | cut -d/ -f3)
          curl -s "$SITE/details/$first_detail_uuid" | grep -q 'application/ld+json' \
            || { echo "::warning title=pre-rendered detail pages not live::$SITE/details/$first_detail_uuid has no Dataset JSON-LD in the served HTML"; exit 1; }
