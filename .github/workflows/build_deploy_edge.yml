name: Build/Deploy Edge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/environment/**'

permissions:
  id-token: write
  contents: read

jobs:
  build_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Yarn install
        run: |
          yarn install --immutable

      - name: Build Website
        run: yarn edge

      - uses: actions/upload-artifact@v6
        with:
            name: build
            path: ./dist
            retention-days: 1

  edge_deploy:
    environment: edge
    runs-on: ubuntu-latest
    needs: build_push
    env:
      DIST: ./dist
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: build
          path: ./dist

      - name: Configure AWS credentials
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Copy files to the production website with the AWS CLI
        run: |
          # sitemap.xml and details/ are owned by the Publish SEO Artifacts workflow;
          # assets/ is never deleted so its pre-rendered pages keep booting until it reruns
          aws s3 sync --delete ${{ env.DIST }} s3://${{ vars.BUCKET }} --region ${{ vars.AWS_REGION }} --exclude "details/*" --exclude "sitemap.xml" --exclude "assets/*"
          aws s3 sync ${{ env.DIST }}/assets s3://${{ vars.BUCKET }}/assets --region ${{ vars.AWS_REGION }}
          # Seed the fallback sitemap only when the bucket has none
          aws s3api head-object --bucket ${{ vars.BUCKET }} --key sitemap.xml --region ${{ vars.AWS_REGION }} >/dev/null 2>&1 \
            || aws s3 cp ${{ env.DIST }}/sitemap.xml s3://${{ vars.BUCKET }}/sitemap.xml --region ${{ vars.AWS_REGION }}

      - name: Clear cloudfront cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ vars.DISTRIBUTION_ID }} \
          --paths "/*" \
          --region ${{ vars.AWS_REGION }}
