name: Build and run UI test

on:
  pull_request:
    branches:
      - main

# cancel currently running workflows from the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ui_test_shard:
    name: ui_test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # A red shard must not cancel the other one, or half the report is lost.
      fail-fast: false
      matrix:
        shard: [1, 2]

    env:
      PYTEST_SPLITS: 2
      PYTEST_GROUP: ${{ matrix.shard }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Uses the container driver required by the GitHub Actions cache backend.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # docker compose invokes Buildx from a shell step, so expose the runtime
      # credentials that type=gha needs for cache import and export.
      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Run playwright tests
        run: |
          docker compose -f playwright/docker-compose.yml up \
            --abort-on-container-exit --exit-code-from tests

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-report-${{ matrix.shard }}
          path: |
            playwright/html-reports/
            playwright/test-results/
          retention-days: 7

  # Branch protection requires a check named "ui_test", but matrix jobs report
  # as "ui_test shard N". This job reports the combined shard result under that
  # name. always() keeps it from being skipped, which would count as passing.
  ui_test:
    needs: ui_test_shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        run: |
          echo "Shard result: ${{ needs.ui_test_shard.result }}"
          test "${{ needs.ui_test_shard.result }}" = "success"
