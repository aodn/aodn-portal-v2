name: AI code review (Kiro)

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  # Manual run, e.g. to review a fork PR (forks never receive secrets on
  # pull_request) or to re-run after the credential is added.
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to review
        type: number
        required: true

permissions: {}

# One review per PR; a new push cancels the review of the previous commit.
concurrency:
  group: kiro-code-review-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # Skip drafts, and PRs labelled skip-ai-review, to save credits.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ai-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      TOOLS: ${{ github.workspace }}/.ai-review/tools/.github/ai-review
      KIRO_REVIEW_WORK_DIR: ${{ runner.temp }}/ai-review
      KIRO_REVIEW_REPO_DIR: ${{ github.workspace }}/.ai-review/pr

    steps:
      - name: Check out review scripts
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-review/tools
          sparse-checkout: .github/ai-review
          persist-credentials: false

      # PR fields are only read from pr.json by scripts, never interpolated
      # with ${{ }}, so a crafted title or body cannot inject shell.
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          HAS_KEY: ${{ secrets.KIRO_API_KEY != '' }}
        run: |
          "$TOOLS/resolve-pr.sh"

      # Credentials are not persisted, so the agent cannot find a token on disk.
      - name: Check out pull request head
        if: steps.pr.outputs.has_key == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: .ai-review/pr
          fetch-depth: 0
          persist-credentials: false

      - name: Run review
        id: review
        if: steps.pr.outputs.has_key == 'true'
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          KIRO_MODEL: ${{ vars.KIRO_MODEL }}
        run: |
          "$TOOLS/review.sh"

      - name: Publish review
        if: ${{ !cancelled() && steps.pr.outputs.head_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          CREDITS: ${{ steps.review.outputs.credits }}
          STATUS: ${{ steps.pr.outputs.has_key != 'true' && 'skipped' || steps.review.outputs.status || 'failed' }}
        run: |
          "$TOOLS/publish.sh"
