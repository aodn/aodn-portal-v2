name: AI code review (reusable)

# Shareable, advisory AI code review for pull requests (aodn/backlog#9311).
# Callers own the triggers (see ai-code-review.yml); this workflow reviews one
# PR and posts a sticky comment. See .github/ai-review/README.md.
#
# The scripts are checked out from the commit that defines THIS workflow
# (job.workflow_sha), never from the pull request, so a PR cannot change how it
# is reviewed. Only .github/ai-review/kiro.sh is specific to the AI tool.

on:
  workflow_call:
    inputs:
      pr-number:
        type: number
        required: true
      model:
        description: Model id. Empty uses the account default.
        type: string
        default: ""
      exclude-paths:
        description: Newline-separated globs left out of the reviewed diff.
        type: string
        default: |
          **/*.lock
          **/package-lock.json
          **/pnpm-lock.yaml
          **/dist/**
          **/*.min.js
          **/*.map
          **/*.snap
          **/*.png
          **/*.jpg
          **/*.svg
    secrets:
      AI_REVIEW_API_KEY:
        description: The AI tool's credential (KIRO_API_KEY). When absent the review is skipped.
        required: false

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      TOOLS: ${{ github.workspace }}/.ai-review/tools/.github/ai-review
      AI_REVIEW_REPO_DIR: ${{ github.workspace }}/.ai-review/pr

    steps:
      - name: Check out review scripts
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-review/tools
          sparse-checkout: .github/ai-review
          persist-credentials: false

      # PR fields are only read from pr.json by scripts, never interpolated
      # with ${{ }}, so a crafted title or body cannot inject shell.
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HAS_KEY: ${{ secrets.AI_REVIEW_API_KEY != '' }}
        run: |
          work="$RUNNER_TEMP/ai-review"
          mkdir -p "$work"
          {
            echo "AI_REVIEW_WORK_DIR=$work"
            echo "AI_REVIEW_PR_JSON=$work/pr.json"
            echo "AI_REVIEW_PROMPT_FILE=$work/prompt.md"
          } >>"$GITHUB_ENV"
          AI_REVIEW_PR_JSON="$work/pr.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" >"$AI_REVIEW_PR_JSON"
          if [[ "$(jq -r .state "$AI_REVIEW_PR_JSON")" != open ]]; then
            echo "::error::PR #$PR_NUMBER is not open."
            exit 1
          fi
          echo "head_sha=$(jq -r .head.sha "$AI_REVIEW_PR_JSON")" >>"$GITHUB_OUTPUT"
          echo "has_key=$HAS_KEY" >>"$GITHUB_OUTPUT"

      # Credentials are not persisted, so the agent cannot find a token on disk.
      - name: Check out pull request head
        if: steps.pr.outputs.has_key == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: .ai-review/pr
          fetch-depth: 0
          persist-credentials: false

      - name: Run review
        id: review
        if: steps.pr.outputs.has_key == 'true'
        env:
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_MODEL: ${{ inputs.model }}
          AI_REVIEW_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        run: |
          set -uo pipefail
          review="$AI_REVIEW_WORK_DIR/review.md"
          if ! prepared="$("$TOOLS/prepare-context.sh")"; then
            status=failed
          elif [[ "$prepared" == empty=true ]]; then
            status=empty
          elif ! timeout 15m "$TOOLS/kiro.sh" | tee "$AI_REVIEW_WORK_DIR/kiro.out"; then
            status=failed
          elif grep -qF -- "$AI_REVIEW_API_KEY" "$review" ||
               grep -qE 'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY' "$review"; then
            echo "::error::The review looked like it contained a credential and was withheld."
            status=failed
          else
            status=ok
          fi
          grep '^credits=' "$AI_REVIEW_WORK_DIR/kiro.out" >>"$GITHUB_OUTPUT" 2>/dev/null
          echo "status=$status" >>"$GITHUB_OUTPUT"

      - name: Publish review
        if: ${{ !cancelled() && steps.pr.outputs.head_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          CREDITS: ${{ steps.review.outputs.credits }}
          STATUS: ${{ steps.pr.outputs.has_key != 'true' && 'skipped' || steps.review.outputs.status || 'failed' }}
        run: |
          "$TOOLS/publish.sh"
