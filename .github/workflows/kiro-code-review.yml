name: AI code review (Kiro)

# Advisory AI code review for pull requests using the Kiro headless CLI
# (trial, aodn/backlog#9311). This file decides when the review runs and which
# engine and credential it uses; the review itself is the shareable,
# tool-agnostic ai-code-review.yml. See .github/ai-review/README.md.

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  # Manual run, e.g. to review a fork PR (forks never receive secrets on
  # pull_request) or to re-run after the credential is added.
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to review
        type: number
        required: true

permissions: {}

# One review per PR; a new push cancels the review of the previous commit.
concurrency:
  group: kiro-code-review-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and PRs labelled skip-ai-review, to save credits.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ai-review'))
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ai-code-review.yml
    with:
      pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
      engine: kiro
      model: ${{ vars.KIRO_MODEL }}
    secrets:
      AI_REVIEW_API_KEY: ${{ secrets.KIRO_API_KEY }}
