name: Publish SEO Artifacts

# Builds sitemap.xml and one pre-rendered page per record, then publishes them
# to S3 under prerender/, where CloudFront sends crawler requests for
# /details/<uuid>. It runs on its own, separate from app deploys.
# What the files are and which commands build them: src/seo/README.md

on:
  schedule:
    # Weekly refresh, Monday morning Hobart time (GitHub cron is UTC)
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: seo-artifacts
  # Every run rebuilds everything, so cancelling an older run loses nothing
  cancel-in-progress: true

jobs:
  # Each environment gets its own publish and verify jobs, so it is checked as
  # soon as it is published, not after all three are done
  seo:
    name: ${{ matrix.environment }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - environment: edge
            site: https://portal-edge.aodn.org.au
          - environment: staging
            site: https://portal-staging.aodn.org.au
          - environment: production
            site: https://portal-beta.aodn.org.au
    uses: ./.github/workflows/seo_publish_and_verify.yml
    with:
      environment: ${{ matrix.environment }}
      site: ${{ matrix.site }}
    secrets: inherit
