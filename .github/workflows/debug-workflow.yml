name: Debug CloudFront Function Upload

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  upload-artifacts:
    name: Upload CloudFront function artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        id: aws_auth
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Upload CloudFront function artifacts
        run: |
          aws s3 sync \
            ./microservices/ \
            "s3://${{ vars.ARTIFACT_BUCKET }}/" \
            --delete \
            --region "${{ vars.AWS_REGION }}" \
            --only-show-errors